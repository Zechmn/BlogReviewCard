<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Blog Preview Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <article class="blog-card">
      <div class="card-image">
        <img src="./assets/images/illustration-article.png" alt="Illustration featuring abstract shapes and code brackets">
      </div>
      
      <div class="card-content">
        <span class="card-category">Learning</span>
        <p class="card-date">Published 21 Dec 2023</p>
        <h1 class="card-title">
          <a href="#" class="card-link">HTML & CSS foundations</a>
        </h1>
        <p class="card-description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
        
        <div class="card-author">
          <img src="./assets/images/image-avatar.webp" alt="Greg Hooper" class="author-avatar">
          <span class="author-name">Greg Hooper</span>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
